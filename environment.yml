name: sat-track-env
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - scipy
  - opencv
  - matplotlib
  - scikit-learn
  - tensorboard
  - joblib
  - termcolor
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=12.1
  - hydra-core
  - omegaconf
  - einops
  - pycocotools
  - pytube
  - safetensors
  - tqdm
  - pip
  - pip:
      - accelerate==0.26.1
      - chumpy
      - smplx
      - scenedetect
      - pyrender==0.1.45
      - trimesh
      - transformers
      - xformers==0.0.28.post1 --extra-index-url https://download.pytorch.org/whl/cu121
      - ffmpeg
      - decord
      - dill
      - rich
      - ripser
      - persim
      - git+https://github.com/facebookresearch/segment-anything.git
