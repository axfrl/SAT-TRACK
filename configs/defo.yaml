pretrain: True
pretrain_path: './weights/sat_hmr/sat_644_3dpw.pth'

input_dir: './demo'
output_dir: './demo_results'
infer_batch_size: 1
infer_num_workers: 8
distributed_infer: True
conf_thresh: 0.7
input_size: 1288
encoder: 'vitb'
#encoder: "efficientvit"
#pretrain: False
#pretrain_path: "./weights/sat_hmr/sat_644.pth"  # ← this must be trained with EfficientViT
#efficientvit_ckpt: "./weights/efficientvit/efficientvit_b1_r288.pt"  # ← add this line

# decoder
hidden_dim: 768
nheads: 4
dec_layers: 6
dim_feedforward: 2048
dropout: 0.0
num_queries: 50
transformer_activation: "relu"

sat_cfg:
  use_sat: True
  share_patch_embed: False
  preprocess_pos_embed: False
  num_lvls: 3
  lvl_embed: True
  get_map_layer: 3
  use_additional_blocks: True
  conf_thresh: 0.3
  scale_thresh: 0.5

dn_cfg:
  use_dn: False
  dn_number: 10
  tgt_embed_type: "params"
  box_noise_scale: 0.4
  tgt_noise_scale: 0.2

mode: "infer"
